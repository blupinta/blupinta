# Releases the Python package to PyPI with trusted publishing: a tag `python-v<version>` builds `python/` and publishes
# it from the `pypi` environment, with no token stored anywhere (PyPI trusts this workflow of this repository).
name: release

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

jobs:
  python:
    name: Python to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/blupinta/
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: The tag names the package's version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "python-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
